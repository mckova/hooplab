[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hooplab"
version = "0.1.0"
description = "AI assistant coach for basketball: learns players from game & practice data, plans practices, assigns homework, scouts opponents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "numpy>=1.26", "python-multipart>=0.0.9", "pillow>=10.1"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "opencv-python-headless>=4.9"]
ai = ["anthropic>=2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["hooplab*"]

[tool.setuptools.package-data]
hooplab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
